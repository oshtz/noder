name: Build

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test:run

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Run release workflow smoke check
        run: npm run test:release-smoke

      - name: Run release artifact verifier tests
        run: npm run test:release-artifacts

      - name: Build frontend
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Check Tauri backend
        run: cargo check
        working-directory: src-tauri

  build-windows:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build -- --no-bundle

      - name: Sign Windows app executable
        id: windows_signing
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERTIFICATE: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PASSWORD)) {
            Write-Warning "Missing Windows signing secrets. Continuing with unsigned Windows binaries."
            "signed=false" >> $env:GITHUB_OUTPUT
            return
          }

          $certPath = Join-Path $env:RUNNER_TEMP "windows-codesign.pfx"
          [Convert]::FromBase64String($env:WINDOWS_CODESIGN_CERTIFICATE) | Set-Content -Path $certPath -AsByteStream
          $securePassword = ConvertTo-SecureString $env:WINDOWS_CODESIGN_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          if (-not $certificate) {
            throw "Failed to import Windows signing certificate"
          }

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe not found"
          }

          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /sha1 $certificate.Thumbprint "src-tauri\target\release\noder.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to sign noder.exe"
          }
          & $signtool.FullName verify /pa /v "src-tauri\target\release\noder.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to verify noder.exe signature"
          }

          "signed=true" >> $env:GITHUB_OUTPUT
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Install Enigma Virtual Box
        shell: pwsh
        env:
          ENIGMA_VIRTUAL_BOX_INSTALLER_URL: ${{ vars.ENIGMA_VIRTUAL_BOX_INSTALLER_URL }}
          ENIGMA_VIRTUAL_BOX_INSTALLER_SHA256: ${{ vars.ENIGMA_VIRTUAL_BOX_INSTALLER_SHA256 }}
        run: |
          # Prefer an operator-controlled mirror/cache, then fall back to public vendor URLs.
          $evbUrls = @()
          if (-not [string]::IsNullOrWhiteSpace($env:ENIGMA_VIRTUAL_BOX_INSTALLER_URL)) {
            $evbUrls += $env:ENIGMA_VIRTUAL_BOX_INSTALLER_URL
          }
          $evbUrls += @(
            "https://www.enigmaprotector.com/assets/files/enigmavb.exe",
            "https://enigmaprotector.com/assets/files/enigmavb.exe",
            "https://web.archive.org/web/2024/https://enigmaprotector.com/assets/files/enigmavb.exe"
          )
          $evbInstaller = Join-Path $env:RUNNER_TEMP "enigmavb_setup.exe"
          Remove-Item -Path $evbInstaller -Force -ErrorAction SilentlyContinue
          $expectedHash = $env:ENIGMA_VIRTUAL_BOX_INSTALLER_SHA256
          if (-not [string]::IsNullOrWhiteSpace($expectedHash)) {
            $expectedHash = $expectedHash.Trim().ToLowerInvariant()
          }

          $downloaded = $false
          foreach ($evbUrl in $evbUrls) {
            Write-Host "Trying: $evbUrl"
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                # Use Invoke-WebRequest with browser-like headers
                $headers = @{
                  "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
                  "Accept" = "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8"
                }
                Invoke-WebRequest -Uri $evbUrl -OutFile $evbInstaller -UseBasicParsing -Headers $headers -MaximumRedirection 5

                if ((Test-Path $evbInstaller) -and (Get-Item $evbInstaller).Length -gt 1MB) {
                  if (-not [string]::IsNullOrWhiteSpace($expectedHash)) {
                    $actualHash = (Get-FileHash -Algorithm SHA256 -Path $evbInstaller).Hash.ToLowerInvariant()
                    if ($actualHash -ne $expectedHash) {
                      Write-Host "SHA256 mismatch for $evbUrl. Expected $expectedHash, got $actualHash"
                      Remove-Item -Path $evbInstaller -Force -ErrorAction SilentlyContinue
                      continue
                    }
                  }
                  $downloaded = $true
                  Write-Host "Downloaded successfully from $evbUrl"
                  break
                }
              } catch {
                Write-Host "Attempt $attempt failed: $_"
              }
              Start-Sleep -Seconds 2
            }
            if ($downloaded) { break }
          }

          if (-not $downloaded) {
            throw "Failed to download EVB installer. Set ENIGMA_VIRTUAL_BOX_INSTALLER_URL and ENIGMA_VIRTUAL_BOX_INSTALLER_SHA256 repository variables to use a controlled cached installer."
          }

          # Install silently
          $process = Start-Process -FilePath $evbInstaller -ArgumentList "/VERYSILENT","/NORESTART" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "EVB installer failed with exit code $($process.ExitCode)"
          }

          # Verify
          if (Test-Path "C:\Program Files (x86)\Enigma Virtual Box\enigmavbconsole.exe") {
            Write-Host "EVB installed successfully"
          } else {
            throw "EVB installation failed"
          }

      - name: Create portable exe
        shell: pwsh
        run: |
          # Install @insco/enigma-virtualbox CLI globally
          npm install -g @insco/enigma-virtualbox
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install @insco/enigma-virtualbox"
          }

          $inputExe = Resolve-Path "src-tauri\target\release\noder.exe"
          $outputExe = Join-Path $PWD "src-tauri\target\release\noder-portable.exe"
          $webviewDll = Get-ChildItem -Path "src-tauri\target" -Filter "WebView2Loader.dll" -Recurse | Select-Object -First 1
          if (-not $webviewDll) {
            throw "WebView2Loader.dll not found under src-tauri\\target"
          }
          $webviewDllPath = $webviewDll.FullName

          # Use enigmavirtualbox to generate a compatible EVB project file
          $evbStaging = Join-Path $PWD "evb-staging"
          New-Item -ItemType Directory -Force -Path $evbStaging | Out-Null
          Copy-Item -Path $webviewDllPath -Destination $evbStaging -Force
          $evbProject = Join-Path $PWD "noder.evb"
          enigmavirtualbox generate $evbStaging --input $inputExe --output $outputExe --project-name $evbProject
          if ($LASTEXITCODE -ne 0) {
            throw "enigmavirtualbox generate failed"
          }
          $evbConsole = "C:\Program Files (x86)\Enigma Virtual Box\enigmavbconsole.exe"
          if (-not (Test-Path $evbConsole)) {
            throw "enigmavbconsole.exe not found at $evbConsole"
          }
          & $evbConsole $evbProject
          if ($LASTEXITCODE -ne 0) {
            throw "enigmavbconsole failed"
          }

          # Verify output
          if (Test-Path $outputExe) {
            $size = [math]::Round((Get-Item $outputExe).Length / 1MB, 2)
            Write-Host "Portable exe created: $size MB"
          } else {
            throw "Failed to create portable exe"
          }

      - name: Sign Windows portable exe
        if: steps.windows_signing.outputs.signed == 'true'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe not found"
          }

          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /sha1 "${{ steps.windows_signing.outputs.thumbprint }}" "src-tauri\target\release\noder-portable.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to sign noder-portable.exe"
          }
          & $signtool.FullName verify /pa /v "src-tauri\target\release\noder-portable.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to verify noder-portable.exe signature"
          }

      - name: Upload portable exe
        uses: actions/upload-artifact@v5
        with:
          name: noder-portable
          path: src-tauri/target/release/noder-portable.exe

      - name: Create zip bundle
        shell: pwsh
        run: |
          $releaseDir = "src-tauri\target\release"
          $zipDir = "noder-win"
          New-Item -ItemType Directory -Force -Path $zipDir | Out-Null

          # Copy main executable
          Copy-Item "$releaseDir\noder.exe" $zipDir

          # Copy WebView2Loader.dll
          $webviewDll = Get-ChildItem -Path "src-tauri\target" -Filter "WebView2Loader.dll" -Recurse | Select-Object -First 1
          if ($webviewDll) {
            Copy-Item $webviewDll.FullName $zipDir
          }

          # Create zip
          Compress-Archive -Path "$zipDir\*" -DestinationPath "noder-win.zip" -Force
          Write-Host "Created noder-win.zip"

      - name: Generate Windows checksums
        shell: pwsh
        run: |
          $files = @(
            "src-tauri\target\release\noder-portable.exe",
            "noder-win.zip"
          )
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 -Path $file
            "$($hash.Hash.ToLowerInvariant())  $(Split-Path -Leaf $file)"
          }
          $lines | Set-Content -Path "SHA256SUMS-windows.txt" -Encoding ascii
          Get-Content "SHA256SUMS-windows.txt"

      - name: Upload zip bundle
        uses: actions/upload-artifact@v5
        with:
          name: noder-win-zip
          path: noder-win.zip

      - name: Upload Windows checksums
        uses: actions/upload-artifact@v5
        with:
          name: noder-windows-checksums
          path: SHA256SUMS-windows.txt

      - name: Determine release tag
        id: release_tag
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF_NAME
            $version = $tag.TrimStart("v")
          } else {
            $version = (Get-Content package.json | ConvertFrom-Json).version
            if (-not $version) {
              throw "package.json version not found"
            }
            $tag = "v$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Upload Windows builds to GitHub release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            src-tauri/target/release/noder-portable.exe
            noder-win.zip
            SHA256SUMS-windows.txt

  build-macos:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Missing Apple signing secrets (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY)."
            exit 1
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/apple_cert.p12
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/apple_cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain
          security default-keychain -s build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Verify notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "Missing notarization secrets (APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID)."
            exit 1
          fi
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_PASSWORD"

      - name: Build Tauri app (app + dmg)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          RUST_LOG: tauri_bundler=debug
          RUST_BACKTRACE: 1
        run: npm run tauri:build -- --bundles app,dmg

      - name: Upload dmg
        uses: actions/upload-artifact@v5
        with:
          name: noder-macOS-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Determine release tag
        id: release_tag
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          else
            version=$(node -p "require('./package.json').version")
            if [ -z "$version" ]; then
              echo "package.json version not found"
              exit 1
            fi
            tag="v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: List bundle contents
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "=== Contents of src-tauri/target/release/bundle ==="
          ls -laR src-tauri/target/release/bundle || echo "Bundle directory not found"

      - name: Create app.zip for auto-update
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          cd src-tauri/target/release/bundle/macos
          # Use ditto to create zip (preserves code signature and attributes)
          ditto -c -k --keepParent "noder.app" "noder.app.zip"
          ls -la
          echo "Created noder.app.zip for auto-update"

      - name: Generate macOS checksums
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          shasum -a 256 src-tauri/target/release/bundle/dmg/*.dmg src-tauri/target/release/bundle/macos/noder.app.zip > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt

      - name: Upload macOS checksums
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v5
        with:
          name: noder-macOS-checksums
          path: SHA256SUMS-macos.txt

      - name: Upload dmg to GitHub release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload app.zip to GitHub release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            src-tauri/target/release/bundle/macos/noder.app.zip
            SHA256SUMS-macos.txt
