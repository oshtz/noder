[package]
name = "noder"
version = "0.1.5"
description = "A node-based creative workflow canvas for chaining AI calls"
authors = ["noder contributors"]
license = "MIT"
repository = "https://github.com/oshtz/noder"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "noder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-store = "2.4.3"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
reqwest = { version = "0.11", features = ["json"] }
chrono = "0.4"
base64 = "0.21"
sha2 = "0.10"
keyring = { version = "3.6.3", default-features = false, features = [
  "apple-native",
  "sync-secret-service",
  "windows-native",
] }
